{% extends "base.html" %}
{% block title %}Log in · Notes Sharing{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">Log in</h1>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </div>
  <p class="muted mt-3">No account yet? <a href="{% url 'accounts:register' %}">Sign up</a></p>
{% endblock %}
