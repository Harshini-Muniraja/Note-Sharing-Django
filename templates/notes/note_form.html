{% extends "base.html" %}
{% block title %}{{ heading }} · Notes Sharing{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">{{ heading }}</h1>
  <div class="panel">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn btn-secondary" href="{% url 'notes:my_notes' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
