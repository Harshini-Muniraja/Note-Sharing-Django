{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Notes Sharing{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="{% url 'notes:my_notes' %}">Notes Sharing</a>
      <nav class="site-nav" aria-label="Main">
        {% if user.is_authenticated %}
          <a href="{% url 'notes:my_notes' %}">My notes</a>
          <a href="{% url 'notes:shared_notes' %}">Shared notes</a>
          <span class="muted">{{ user.get_username }}</span>
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="link-button">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}">Log in</a>
          <a href="{% url 'accounts:register' %}">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="page {% block page_class %}{% endblock %}">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
